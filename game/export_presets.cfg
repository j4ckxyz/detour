; Export presets for CI (.github/workflows/build.yml) and local exports:
;   godot --headless --path game --export-release "Linux" ../export/linux/detour.x86_64
; The version comes from application/config/version in project.godot.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../export/linux/detour.x86_64"
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0

[preset.1]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../export/macos/Detour.zip"
script_export_mode=2

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="io.github.j4ckxyz.detour"
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright="Detour contributors"
codesign/codesign=1
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.2]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../export/windows/Detour.exe"
script_export_mode=2

[preset.2.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
application/product_name="Detour"
application/file_description="Detour"
application/company_name="Detour contributors"
debug/export_console_wrapper=0
