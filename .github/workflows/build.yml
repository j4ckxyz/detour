name: Build

# Every push and PR: Rust checks, headless game tests, and game builds for Linux (AppImage),
# macOS (universal .app) and Windows (installer + portable zip).
# Pushes to main refresh the rolling "nightly" pre-release; v* tags publish a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: "4.7.2"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the world-gen golden hashes: x86_64 Linux must match what macOS arm64 made.
      - run: cargo test --workspace

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: pip install ziglang cargo-zigbuild
      - name: Build rvcore (glibc 2.28) and check world-gen determinism
        run: python3 tools/build_native.py --check --target x86_64-unknown-linux-gnu --glibc 2.28
      - uses: actions/cache@v4
        with:
          path: ~/.cache/detour-godot
          key: godot-${{ env.GODOT_VERSION }}-linux-v1
      - id: godot
        run: python3 tools/ci/setup_godot.py --platform linux
      - uses: actions/cache@v4
        with:
          path: game/.godot/imported
          key: import-linux-${{ hashFiles('game/assets/**', 'game/project.godot') }}
      - name: Import assets
        run: '"${{ steps.godot.outputs.godot }}" --headless --path game --import'
      - name: Game tests (headless)
        run: |
          cargo build --release -p detour-relay
          GODOT="${{ steps.godot.outputs.godot }}" tools/test_game.sh
      - name: Export
        run: |
          mkdir -p export/linux
          tools/ci/write_build_info.sh
          "${{ steps.godot.outputs.godot }}" --headless --path game --export-release "Linux" ../export/linux/detour.x86_64
          ls -la export/linux
          test -x export/linux/detour.x86_64 && test -f export/linux/librvcore.x86_64.so
      - name: Package AppImage and tarball
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" tools/package/appimage.sh export/linux dist/Detour-x86_64.AppImage
          tar -czf dist/Detour-linux-x86_64.tar.gz -C export linux
      - uses: actions/upload-artifact@v4
        with:
          name: detour-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build rvcore (universal) and check world-gen determinism
        run: python3 tools/build_native.py --check --universal
      - uses: actions/cache@v4
        with:
          path: ~/.cache/detour-godot
          key: godot-${{ env.GODOT_VERSION }}-macos-v1
      - id: godot
        run: python3 tools/ci/setup_godot.py --platform macos
      - uses: actions/cache@v4
        with:
          path: game/.godot/imported
          key: import-macos-${{ hashFiles('game/assets/**', 'game/project.godot') }}
      - name: Import assets
        run: '"${{ steps.godot.outputs.godot }}" --headless --path game --import'
      - name: Updater tests
        run: '"${{ steps.godot.outputs.godot }}" --headless --path game --script res://tests/updater_units.gd'
      - name: Export
        run: |
          mkdir -p export/macos dist
          tools/ci/write_build_info.sh
          "${{ steps.godot.outputs.godot }}" --headless --path game --export-release "macOS" ../export/macos/Detour.zip
          cd export/macos
          unzip -q Detour.zip
          codesign --verify --deep --strict Detour.app
          for f in Detour.app/Contents/MacOS/Detour Detour.app/Contents/Frameworks/librvcore.dylib; do
            for arch in arm64 x86_64; do lipo "$f" -verify_arch "$arch"; done
          done
          cp Detour.zip ../../dist/Detour-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: detour-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (installer + zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rvcore and check world-gen determinism
        run: python tools/build_native.py --check
      - uses: actions/cache@v4
        with:
          path: ~/.cache/detour-godot
          key: godot-${{ env.GODOT_VERSION }}-windows-v1
      - id: godot
        run: python tools/ci/setup_godot.py --platform windows
      - uses: actions/cache@v4
        with:
          path: game/.godot/imported
          key: import-windows-${{ hashFiles('game/assets/**', 'game/project.godot') }}
      - name: Import assets
        run: '"${{ steps.godot.outputs.godot }}" --headless --path game --import'
      - name: Updater tests
        run: '"${{ steps.godot.outputs.godot }}" --headless --path game --script res://tests/updater_units.gd'
      - name: Export
        run: |
          mkdir -p export/windows dist
          tools/ci/write_build_info.sh
          "${{ steps.godot.outputs.godot }}" --headless --path game --export-release "Windows" ../export/windows/Detour.exe
          ls -la export/windows
          test -f export/windows/Detour.exe && test -f export/windows/rvcore.x86_64.dll
          7z a -tzip dist/Detour-windows-x86_64.zip ./export/windows/*
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $base = (Select-String -Path game/project.godot -Pattern '^config/version="(.*)"$').Matches[0].Groups[1].Value
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "$base-nightly" }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\export\windows" "/DOutputDir=$PWD\dist" tools\package\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: detour-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish downloads
    needs: [rust, linux, macos, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          **Downloads**
          - **Windows:** `Detour-Setup-x86_64.exe` (installer) or `Detour-windows-x86_64.zip` (portable). The build is unsigned, so SmartScreen may warn: *More info → Run anyway*.
          - **macOS (Apple Silicon and Intel):** unzip `Detour-macos-universal.zip`. The app is ad-hoc signed, not notarised: right-click *Detour* → *Open*, or run `xattr -dr com.apple.quarantine Detour.app`.
          - **Linux / Steam Deck:** `chmod +x Detour-x86_64.AppImage && ./Detour-x86_64.AppImage`, or use the tarball.

          Verify downloads against `SHA256SUMS`.
          EOF
      - name: Refresh nightly pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          { echo "Automatic build of \`main\` at ${GITHUB_SHA::7}. Early development: expect rough edges."; echo; cat notes.md; } > nightly.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" --notes-file nightly.md
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Detour $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${flags[@]}"
