[workspace]
resolver = "3"
members = [
    "native/rvgen",
    "native/rvcore",
    "native/rvgen-cli",
    "server/relay",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
rvgen = { path = "native/rvgen" }

[profile.release]
lto = "fat"
codegen-units = 1
# Keep unwinding: godot-rust turns a panic inside a #[func] into a Godot error instead of a crash.

# The generator is heavy (route surveys, valley walls): tests and dev builds run it
# optimised. Rust has no fast-math, so this changes speed only, never results.
[profile.dev.package.rvgen]
opt-level = 3
